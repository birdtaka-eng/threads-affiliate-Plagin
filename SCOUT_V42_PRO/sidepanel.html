<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sanctuary SCOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #6c5ce7; --accent: #feca57; --bg: #0f172a; --card: #1e293b; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: white; margin: 0; padding: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
    h1 { font-size: 1.25rem; margin: 0 0 15px 0; color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
    #ver { font-size: 0.7rem; opacity: 0.6; }
    .status-bar { font-size: 0.85rem; margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border-left: 3px solid #00d2d3; }
    #image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; min-height: 100px; }
    #image-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    #image-grid img:hover { transform: scale(1.05); }
    #image-grid img.selected { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--primary), #a29bfe); color: white; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
    button:hover { transform: translateY(-2px); filter: brightness(1.1); }
    #status-msg { margin-top: 15px; font-size: 0.8rem; color: #feca57; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sanctuary <span id="ver">SCOUT V1.0</span></h1>
    <div class="status-bar" id="target-info">ターゲット捕捉中...</div>
    <div id="image-grid"></div>
    <button id="send-btn">📸 聖域（シート）へ保存</button>
    <div id="status-msg">Waiting for mission...</div>
    <button id="sync-btn" style="margin-top: 10px; background: transparent; border: 1px solid var(--primary); font-size: 0.8rem; padding: 8px;">🔄 画像を再抽出</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
