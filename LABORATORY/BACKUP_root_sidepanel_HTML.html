<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>GEMA Phoenix PRO - Sidepanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6c5ce7;
      --accent: #feca57;
      --bg: #0f172a;
      --card: #1e293b;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: white;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 15px 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tab-container {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--card);
    }

    .tab {
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      background: transparent;
      color: white;
      opacity: 0.6;
      border: none;
      font-size: 0.9rem;
    }

    .tab.active {
      background: var(--card);
      opacity: 1;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    #ver {
      font-size: 0.7rem;
      opacity: 0.6;
    }

    .status {
      font-size: 0.85rem;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border-left: 3px solid #00d2d3;
    }

    #imageGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    #imageGrid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    #imageGrid img:hover {
      transform: scale(1.05);
    }

    #imageGrid img.selected {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #a29bfe);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    #status-msg {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #feca57;
      text-align: center;
    }

    /* GAS Dev Mode Styles */
    #gasDevMode {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
      /* Adjust as needed */
    }

    #chat-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin-bottom: 10px;
    }

    #chat-messages {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
    }

    .user-message {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      margin-left: auto;
    }

    .ai-message {
      background: #374151;
      color: white;
      align-self: flex-start;
    }

    #chat-form {
      display: flex;
    }

    #chat-input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid var(--card);
      border-radius: 8px 0 0 8px;
      background: #374151;
      color: white;
      border-right: none;
    }

    #chat-submit {
      padding: 10px 15px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GEMA Phoenix <span id="ver">V42.2 PRO</span></h1>

    <div class="tab-container">
      <button class="tab active" id="tab-thread">スレッド分析</button>
      <button class="tab" id="tab-gas">GAS開発支援</button>
    </div>

    <!-- Thread Analysis Panel -->
    <div class="panel active" id="threadAnalysisMode">
      <div class="status" id="productName">
        ターゲットを待機中...
      </div>
      <div id="imageGrid">
        <!-- Images populate here -->
      </div>
      <button id="btnSave">📸 聖域へ一撃保存</button>
      <div id="status">Waiting for mission...</div>
    </div>

    <!-- GAS Dev Support Panel -->
    <div class="panel" id="gasDevMode">
      <div class="status" id="gasFileContext">対象ファイル: なし</div>
      <div id="chat-container">
        <ul id="chat-messages">
          <!-- AI and user messages will be appended here -->
          <li class="message ai-message">GAS開発支援モードへようこそ。どのようなご用件でしょうか？</li>
        </ul>
      </div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="メッセージを入力..." autocomplete="off">
        <button type="submit" id="chat-submit">送信</button>
      </form>
    </div>

  </div>

  <!-- Scripts -->
  <script src="Config.js"></script>
  <script src="PersonaMaster.js"></script>
  <script src="OllamaMock.js"></script>
  <script src="AIAdapter.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
