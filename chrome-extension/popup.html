<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads職人 Pro</title>
  <style>
    :root {
      --primary: #0095f6;
      --bg: #ffffff;
      --text: #1a1a1a;
      --border: #efefef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      width: 550px;
      /* 面積拡大（横幅） */
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
    }

    .status-badge {
      font-size: 11px;
      background: #eee;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* 画像表示エリア */
    .image-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    #countDisplay {
      color: var(--primary);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      /* 余白を広げて重なりを解消 */
      max-height: 500px;
      /* 高さを拡大 */
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
    }

    .img-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* 全体を見やすくし、重なり感を抑える */
      background: #fff;
    }

    .img-item.selected {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 149, 246, 0.4);
    }

    .img-item input[type="checkbox"] {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      cursor: pointer;
      z-index: 10;
    }

    /* アクション */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-main:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-main:hover:not(:disabled) {
      background: #0081d6;
    }

    .footer-info {
      font-size: 11px;
      color: #999;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Threads職人 Pro</h2>
    <span class="status-badge" id="platformDisplay">読み込み中...</span>
  </div>

  <div class="image-section">
    <div class="section-title">
      <span>写真を選択 (最大3枚)</span>
      <span id="countDisplay">0 / 3</span>
    </div>
    <div id="imageGrid" class="image-grid">
      <!-- ここにスクレイピング結果を表示 -->
      <div style="grid-column: span 3; padding: 40px; text-align: center; color: #ccc;">
        ページから画像を探しています...
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-main" disabled>
      <span>🚀</span> ボードへ保存
    </button>
  </div>

  <div class="footer-info">
    保存先: 投稿作成ボード (D, E, F列)<br>
    <a href="#" id="resetSettings" style="color: #999; text-decoration: underline; font-size: 10px;">⚙️ 設定リセット
      (URL再入力)</a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
