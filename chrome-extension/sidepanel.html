<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 12px;
            background: #fff;
            margin: 0;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .badge {
            background: #000;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .input-area {
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            resize: vertical;
            min-height: 50px;
        }

        textarea:focus {
            outline: none;
            border-color: #0095f6;
            box-shadow: 0 0 0 2px rgba(0, 149, 246, 0.1);
        }

        button#saveBtn {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            height: fit-content;
            align-self: flex-start;
        }

        button#saveBtn:hover {
            background: #333;
        }

        .help-text {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
            line-height: 1.3;
        }

        .queue-header {
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #listContainer {
            padding-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            color: #ccc;
            font-size: 12px;
            padding: 40px 0;
            border: 2px dashed #eee;
            border-radius: 8px;
            margin-top: 10px;
            background: #fafafa;
        }

        .draft-item {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
            position: relative;
        }

        .draft-item:hover {
            border-color: #0095f6;
            box-shadow: 0 2px 8px rgba(0, 149, 246, 0.15);
        }

        .draft-text {
            font-size: 13px;
            line-height: 1.5;
            color: #333;
            white-space: pre-wrap;
            margin-bottom: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .time-tag {
            font-size: 11px;
            color: #e0245e;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fff5f8;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .cat-tag {
            font-size: 10px;
            color: #666;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .set-btn {
            background: #0095f6;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .set-btn:hover {
            background: #0081d6;
        }

        .del-btn {
            background: #fff;
            color: #999;
            border: 1px solid #eee;
            padding: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            min-width: 32px;
        }

        .del-btn:hover {
            color: #d00;
            border-color: #d00;
            background: #fff5f5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        /* Image Grid Styles */
        .image-section {
            margin: 10px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding: 8px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .img-item {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .img-item.selected {
            border-color: #0095f6;
            box-shadow: 0 0 0 2px rgba(0, 149, 246, 0.2);
        }

        .img-item input {
            position: absolute;
            top: 4px;
            right: 4px;
            margin: 0;
            cursor: pointer;
        }
    </style>
    <script src="sidepanel.js" defer></script>
</head>

<body>
    <div class="header">
        <h2>Threads職人</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="resetBtn" title="設定リセット (GAS URL再入力)"
                style="background: none; border: none; cursor: pointer; font-size: 16px; padding: 0;">⚙️</button>
            <span class="badge">V6.8.0</span>
        </div>
    </div>

    <div class="input-area" style="margin-bottom: 20px;">
        <!-- Two-Stage Gemini Control -->
        <div
            style="background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e1e4e8;">
            <h3 style="margin: 0 0 8px 0; font-size: 13px;">🧞‍♀️ 3姉妹システム</h3>

            <!-- Sync Settings -->
            <button id="syncSettingsBtn"
                style="width: 100%; background: #e0e0e0; color: #333; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; font-size: 11px;">
                <span>🔄</span> スプレッドシートから設定(プロンプト等)を同期
            </button>

            <!-- Step 1: Preparation -->
            <button id="wakeUpBtn"
                style="width: 100%; background: #6c757d; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                <span>💤</span> ① 3姉妹を召喚 (まずここ)
            </button>

            <button id="sendRulesBtn"
                style="width: 100%; background: #fd7e14; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                <span>🦄</span> ② プロンプト送信 (準備)
            </button>

            <button id="sendMatomeRulesBtn"
                style="width: 100%; background: #20c997; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                <span>📋</span> ② まとめ用プロンプト送信
            </button>

            <!-- New Step: Fetch Images from Sheet via Clipboard -->
            <button id="fetchSheetImagesBtn"
                style="width: 100%; background: #6f42c1; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                <span>📊</span> セルをクリック→追加読込 (最大6枚)
            </button>

            <!-- Image Selection Area -->
            <div class="image-section" style="margin: 10px 0;">
                <div
                    style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; font-weight: bold;">
                    <span>📸 写真 (1枚ずつ追加・最大6枚)</span>
                    <span style="display:flex;gap:4px;align-items:center;">
                        <span id="countDisplay" style="color: #0095f6;">0 / 6</span>
                        <button id="clearImagesBtn"
                            style="background:#e0245e;color:white;border:none;border-radius:4px;padding:0 6px;font-size:11px;cursor:pointer;">🗑️</button>
                    </span>
                </div>
                <div id="imageGrid" class="image-grid">
                    <div style="grid-column: span 3; padding: 20px; text-align: center; color: #ccc; font-size: 11px;">
                        商品ページを開くか、シートから画像を読み込むとここに出ます
                    </div>
                </div>
            </div>

            <!-- Step 2: Execution -->
            <button id="processProductBtn"
                style="width: 100%; background: linear-gradient(45deg, #FF6B6B, #4ECDC4); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span>🎁</span> ③ 商品を渡す (本番)
            </button>
            <!-- Removed Auto-Save Note -->
            <div style="text-align: center; font-size: 10px; color: #e0245e; margin-top: 4px; font-weight: bold;">
                ※処理中（約10秒）はマウスを操作しないでください
            </div>

            <div id="statusDisplay" style="font-size: 11px; margin-top: 8px; color: #666; text-align: center;"></div>
        </div>

    </div>

    <!-- Step 3: Save Images (New) -->
    <div style="margin-top: 10px; margin-bottom: 20px;">
        <button id="saveImagesBtn"
            style="width: 100%; background: #20c997; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>📸</span> 画像を保存 (新規行)
        </button>
        <div style="font-size: 10px; color: #666; margin-top: 4px; text-align: center;">
            ※選択した画像をD〜F列に保存します
        </div>
    </div>

    <!-- Manual Input Areas -->
    <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px;">

        <!-- Threads Post Area -->
        <div style="margin-bottom: 20px;">
            <div
                style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #333; display: flex; justify-content: space-between;">
                <span>🧵 Threads投稿用</span>
                <span style="font-size: 10px; color: #999;">ここに貼り付け</span>
            </div>
            <textarea id="postContent" placeholder="Geminiから選んだ文章をここに貼り付け..."
                style="width: 100%; height: 120px; box-sizing: border-box; font-family: sans-serif; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"></textarea>
        </div>

        <!-- Rakuten ROOM Area -->
        <div style="margin-bottom: 20px;">
            <div
                style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #c3002f; display: flex; justify-content: space-between;">
                <span>🛒 楽天ROOM用</span>
                <span style="font-size: 10px; color: #999;">保存用</span>
            </div>
            <textarea id="roomContent" placeholder="ROOMの紹介文..."
                style="width: 100%; height: 80px; box-sizing: border-box; font-family: sans-serif; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"></textarea>
        </div>

        <!-- Save Text Button (Renamed) -->
        <button id="saveTextBtn"
            style="width: 100%; background: #0095f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
            <span>📝</span> 文章を保存 (新規行)
        </button>
        <div class="help-text">
            上のテキストボックスの内容（Threads/ROOM）をボードに保存します。（画像は保存されません）
        </div>

    </div>
</body>

</html>
