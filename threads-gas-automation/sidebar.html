<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <style>
        :root {
            --bg-primary: #0f172a;
            /* Slate 900 */
            --bg-secondary: #1e293b;
            /* Slate 800 */
            --accent: #6366f1;
            /* Indigo 500 */
            --text-primary: #f8fafc;
            /* Slate 50 */
            --text-secondary: #94a3b8;
            /* Slate 400 */
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Master Action Panel (New) --- */
        #action-panel {
            display: none;
            /* Hidden by default */
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .master-badge {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .img-count-badge {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* --- Editor Area (Existing) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .editor-container {
            flex-grow: 1;
            position: relative;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: var(--text-primary);
            padding: 12px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            box-sizing: border-box;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            display: inline-block;
            margin-right: 5px;
        }

        .status-dot.active {
            background-color: var(--success);
            box-shadow: 0 0 5px var(--success);
        }

        .status-dot.saving {
            background-color: var(--warning);
        }

        .status-dot.error {
            background-color: var(--error);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-item {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            cursor: copy;
            border: 2px solid transparent;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .preview-item:hover {
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <!-- Action Panel (Dynamic) -->
    <div id="action-panel">
        <span class="master-badge" id="master-uid">MASTER DETECTED</span>

        <!-- Controls -->
        <!-- Controls (Flex Wrap for safety) -->
        <div
            style="margin-bottom:8px; font-size:11px; color:var(--text-secondary); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;">
            <label style="cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap;">
                <input type="checkbox" id="openUrlCheck" checked style="accent-color:var(--accent);"
                    onchange="updateUrlStatus()">
                <span>Open URL</span>
            </label>
            <button id="copyPromptBtn" onclick="copyPromptText()"
                style="display:none; background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:4px; padding:2px 8px; cursor:pointer; font-size:10px; white-space:nowrap;">
                📝 Copy Prompt
            </button>
        </div>

        <button id="goBtn" class="btn-action" onclick="runMasterFlow()">
            <span>🚀 Copy & Go</span>
            <span id="img-badge" class="img-count-badge">0 IMG</span>
        </button>

        <!-- NEW: Download All Button (Hidden by default) -->
        <div class="row" style="margin-top:5px;">
            <button id="downloadAllBtn" class="secondary-btn" style="display:none; background:#444;">
                <span>📥 Download All (For Drag&Drop)</span>
            </button>
        </div>

        <!-- Image Preview -->
        <div id="preview-container"
            style="display:none; margin-top:10px; border:1px dashed var(--glass-border); padding:8px; border-radius:4px; max-height:300px; overflow-y:auto;">
            <!-- Images will be injected here -->
        </div>

        <div id="action-status" style="font-size:11px; margin-top:5px; min-height:15px; color:#cbd5e1;"></div>
    </div>

    <!-- Editor Header -->
    <div class="header">
        <span class="title">AI Cockpit // Editor <span
                style="font-size:9px; background:var(--accent); padding:2px 4px; border-radius:3px; color:white;">v2.5-STABLE</span></span>
        <div id="status-indicator">
            <span class="status-dot" id="dot"></span>
            <span id="status-text">Ready</span>
        </div>
    </div>

    <!-- Main Editor -->
    <div class="editor-container">
        <textarea id="editor" placeholder="Select a cell..."></textarea>
    </div>

    <div class="footer">
        <span style="opacity:0.5">Auto-save enabled</span>
        <button onclick="saveContent()"
            style="background:transparent; border:1px solid var(--glass-border); color:var(--text-secondary); border-radius:4px; padding:4px 8px; cursor:pointer;">Save</button>
    </div>

    <div id="debug-footer"
        style="font-size:9px; color:#475569; text-align:right; margin-top:8px; font-family:monospace;">
        Initializing...
    </div>

    <script>
        // --- State ---
        let currentText = "";
        let currentMaster = null;
        let currentImages = [];
        let currentRow = 0; // New: Selected row
        let currentPromptText = ""; // New

        // New: Preloaded Blobs for Instant Copy (User Gesture Safety)
        let preloadedBlobs = [];
        let isPreloading = false;

        // --- Debug Info ---
        function updateDebug(msg) {
            const footer = document.getElementById('debug-footer');
            if (footer) footer.textContent = msg;
        }

        // --- Polling (Sequential to avoid TransportError) ---
        let isPolling = false;
        setTimeout(pollContext, 1000);

        function pollContext() {
            if (isPolling) return; // Prevent overlapping

            // Don't poll while user is typing vigorously
            const editor = document.getElementById('editor');
            if (document.activeElement === editor && editor.value !== currentText) {
                setTimeout(pollContext, 1000);
                return;
            }

            isPolling = true;
            google.script.run
                .withSuccessHandler(data => {
                    renderUI(data);
                    isPolling = false;
                    setTimeout(pollContext, 1000);
                })
                .withFailureHandler(e => {
                    updateDebug("Poll Error: " + e.message);
                    isPolling = false;
                    setTimeout(pollContext, 2000); // Wait longer on error
                })
                .getSidebarContent();
        }

        function renderUI(data) {
            try {
                if (!data) return;
                currentRow = data.row || 0; // Track row

                // Debug Update
                const timestamp = new Date().toLocaleTimeString();
                updateDebug(`[${timestamp}] Mode: ${data.mode} | Row: ${data.row || '-'} | ${data.debugInfo || ''}`);

                if (data.mode === 'error') {
                    updateDebug("Server Error: " + data.message);
                    return;
                }

                // 1. Text Editor Sync
                const editor = document.getElementById('editor');
                if (data.text !== undefined && data.text !== currentText) {
                    if (document.activeElement !== editor) {
                        editor.value = data.text;
                        currentText = data.text;
                        updateStatus("Synced", "active");
                    }
                }

                // 2. Mode Switching
                const panel = document.getElementById('action-panel');
                const editorElems = document.querySelectorAll('.header, .editor-container, .footer');
                const masterUid = document.getElementById('master-uid');
                const imgBadge = document.getElementById('img-badge');
                const btn = document.getElementById('goBtn');

                if (data.mode === 'board_master' && data.masterName) {
                    editorElems.forEach(el => el.style.display = 'none');

                    masterGems = data.masterGems || {};
                    let mName = data.masterName;
                    let targetKey = Object.keys(masterGems).find(k => k.toLowerCase() === String(mName).trim().toLowerCase());

                    if (targetKey) {
                        // VALID MASTER
                        // Check if we need to update state
                        const newImages = data.imageUrls || [];
                        const needsUpdate = (currentMaster !== targetKey) || (currentImages.join(',') !== newImages.join(','));

                        if (needsUpdate) {
                            currentMaster = targetKey;
                            currentImages = newImages;

                            masterUid.textContent = "To: " + targetKey + " 師匠";
                            imgBadge.textContent = currentImages.length + " IMG";
                            panel.style.display = "block";

                            // Colors
                            if (targetKey === "Poison") btn.style.backgroundColor = "#ef4444";
                            else if (targetKey === "Var") btn.style.backgroundColor = "#10b981";
                            else if (targetKey === "Rewrite") btn.style.backgroundColor = "#f59e0b";
                            else btn.style.backgroundColor = "#6366f1";

                            // Prompt Button Logic
                            currentPromptText = data.promptText || "";
                            const promptBtn = document.getElementById('copyPromptBtn');
                            if (currentPromptText) {
                                promptBtn.style.display = "inline-block";
                            } else {
                                promptBtn.style.display = "none";
                            }

                            // Trigger Preload!
                            preloadImages(data.hasCollage);
                        }
                    } else {
                        // INVALID MASTER
                        if (panel.style.display !== "none") panel.style.display = "none";
                        editorElems.forEach(el => el.style.display = 'flex');
                        currentMaster = null;
                        currentImages = [];
                    }
                } else {
                    // TEXT MODE
                    if (panel.style.display !== "none") panel.style.display = "none";
                    editorElems.forEach(el => el.style.display = 'flex');
                    currentMaster = null;
                    currentImages = [];
                }
            } catch (e) {
                console.error(e);
                updateDebug("UI Error: " + e.message);
            }
        }

        // --- Preload Logic ---
        function preloadImages(hasCollage) {
            currentImageIndex = 0; // Reset index on new load
            const btn = document.getElementById('goBtn');
            const dlBtn = document.getElementById('downloadAllBtn');
            const previewContainer = document.getElementById('preview-container');
            const statusFn = (msg) => document.getElementById('action-status').textContent = msg;

            // Reset Content Safely
            while (previewContainer.firstChild) previewContainer.removeChild(previewContainer.firstChild);

            const label = document.createElement('div');
            label.style.fontSize = '10px';
            label.style.color = 'var(--text-secondary)';
            label.style.marginBottom = '4px';
            label.textContent = hasCollage ? '✨ Combined Collage detected' : 'Click to Copy / Drag & Drop';
            previewContainer.appendChild(label);

            previewContainer.style.display = 'block';
            if (dlBtn) dlBtn.style.display = 'none'; // Hide initially
            isPreloading = true;

            // If collage exists, show a button to load it (to avoid heavy polling)
            if (hasCollage) {
                const loadBtn = document.createElement('button');
                loadBtn.textContent = "🖼 Load Combined Collage";
                loadBtn.className = 'btn-action';
                loadBtn.style.padding = '8px';
                loadBtn.style.fontSize = '11px';
                loadBtn.style.marginTop = '4px';
                loadBtn.onclick = async () => {
                    statusFn("⏳ Fetching collage data...");
                    google.script.run
                        .withSuccessHandler(res => {
                            if (res && res.data) {
                                const collageImg = document.createElement('img');
                                collageImg.src = "data:" + res.mimeType + ";base64," + res.data;
                                collageImg.className = 'preview-item';
                                collageImg.style.border = '2px solid var(--accent)';
                                collageImg.title = "Combined Collage - Click to Copy";
                                collageImg.onclick = async () => {
                                    try {
                                        const blob = await fetch(collageImg.src).then(r => r.blob());
                                        const item = new ClipboardItem({ [res.mimeType]: blob });
                                        await navigator.clipboard.write([item]);
                                        statusFn("✅ Combined Collage Copied!");
                                    } catch (e) { statusFn("❌ Copy failed: " + e.message); }
                                };
                                previewContainer.appendChild(collageImg);
                                loadBtn.style.display = 'none';
                                statusFn("✅ Collage loaded!");
                            } else {
                                statusFn("❌ Collage data empty.");
                            }
                        })
                        .getCollageBase64(currentRow);
                };
                previewContainer.appendChild(loadBtn);
            }

            if (currentImages.length === 0 && !hasCollage) {
                btn.disabled = false;
                btn.querySelector('span').textContent = "🚀 Open (No Img)";
                statusFn("Ready to open");
                isPreloading = false;
                return;
            }

            btn.disabled = true;
            btn.querySelector('span').textContent = "⏳ Loading Images...";
            statusFn("Downloading " + currentImages.length + " images...");

            let loadedCount = 0;

            currentImages.forEach((url, index) => {
                google.script.run
                    .withSuccessHandler(async (result) => {
                        if (result && result.data) {
                            try {
                                // Create Image Element
                                const imgPrefix = "data:" + result.mimeType + ";base64,";
                                const img = document.createElement('img');
                                img.src = imgPrefix + result.data;
                                img.className = 'preview-item';
                                img.title = "Ready to Copy";

                                // Convert to PNG Blob immediately
                                await new Promise(resolve => {
                                    img.onload = resolve;
                                });
                                const pngBlob = await convertToPngBlob(img);

                                // Store in global array
                                preloadedBlobs[index] = {
                                    blob: pngBlob,
                                    mimeType: "image/png", // Always PNG
                                    element: img
                                };

                                // Show Preview
                                previewContainer.appendChild(img);

                                // 1. Enhanced Drag Support
                                img.ondragstart = (e) => {
                                    // Set data for drag
                                    e.dataTransfer.setData("text/html", `<img src="${img.src}">`);
                                    e.dataTransfer.setData("text/uri-list", img.src);
                                };

                                // 2. Click to Manual Copy (via PNG conversion)
                                img.onclick = async () => {
                                    try {
                                        statusFn("🔄 Converting to PNG for Clipboard...");
                                        const item = new ClipboardItem({ "image/png": pngBlob });
                                        await navigator.clipboard.write([item]);
                                        statusFn("✅ Copied Image " + (index + 1) + " (PNG)");
                                    } catch (e) {
                                        console.error(e);
                                        statusFn("⚠️ Copy Failed: " + e.message);
                                    }
                                };

                            } catch (e) {
                                console.error("Preload conversion failed", e);
                            }
                        }
                        loadedCount++;
                        checkDone();
                    })
                    .withFailureHandler(e => {
                        console.error("Preload fetch failed", e);
                        loadedCount++;
                        checkDone();
                    })
                    .fetchImageAsBase64(url);
            });

            function checkDone() {
                if (loadedCount >= currentImages.length) {
                    isPreloading = false;
                    btn.disabled = false;
                    btn.querySelector('span').textContent = "🚀 Copy & Go";

                    const successCount = preloadedBlobs.filter(b => b).length;
                    statusFn(successCount > 0 ? "✅ Ready! Click to Copy & Go" : "⚠️ Load Failed. Open Only?");

                    // Enable Download Button
                    if (dlBtn) {
                        dlBtn.style.display = 'block';
                        dlBtn.onclick = () => downloadAllImages(preloadedBlobs);
                    }
                }
            }
        }


        // --- Bulk Download Function ---
        function downloadAllImages(blobs) {
            const statusFn = (msg) => document.getElementById('action-status').textContent = msg;
            if (!blobs || blobs.length === 0) {
                statusFn("No images to download.");
                return;
            }
            statusFn("📥 Downloading " + blobs.length + " images...");

            blobs.forEach((item, idx) => {
                if (!item || !item.blob) return;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(item.blob);
                a.download = `threads_img_${idx + 1}.png`; // Force PNG
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href); // Clean up the object URL
            });
            statusFn("✅ Download initiated.");
        }

        // --- Action Flow (Single Image Revert) ---
        // --- Action Flow (Manual Relay) ---
        let currentImageIndex = 0;

        async function runMasterFlow() {
            if (!currentMaster || isPreloading) return;

            const btn = document.getElementById('goBtn');
            const statusFn = (msg) => document.getElementById('action-status').textContent = msg;
            const targetUrl = masterGems[currentMaster];
            const badge = document.getElementById('img-badge');
            const openUrl = document.getElementById('openUrlCheck').checked;

            // Safety Check
            if (preloadedBlobs.length === 0) {
                statusFn("⚠️ No Images Loaded");
                return;
            }

            // --- Logic: Copy Current Index ---
            try {
                const item = preloadedBlobs[currentImageIndex];
                if (item && item.blob) {
                    statusFn(`📸 Copying Image ${currentImageIndex + 1}/${preloadedBlobs.length}...`);

                    const clipboardItem = new ClipboardItem({ [item.mimeType]: item.blob });
                    await navigator.clipboard.write([clipboardItem]);

                    statusFn(`✅ Image ${currentImageIndex + 1} Copied! Paste it!`);
                } else {
                    statusFn(`⚠️ Image ${currentImageIndex + 1} Missing/Error`);
                }
            } catch (e) {
                console.error(e);
                statusFn("⚠️ Copy Error: " + e.message);
                alert("Copy Failed: " + e.message);
                return;
            }

            // --- Behavior: First Image vs Others ---
            if (currentImageIndex === 0) {
                // First Image: Open Tab ONLY if checkbox is checked
                if (openUrl) {
                    setTimeout(() => {
                        const finalUrl = targetUrl.includes('#') ? targetUrl : targetUrl + "#auto_paste";
                        window.open(finalUrl, '_blank');
                    }, 500);
                    statusFn(`✅ Copied Img 1 & Opened URL!`);
                } else {
                    statusFn(`✅ Copied Img 1 (No URL opened)`);
                }
            }

            // --- Advance Step ---
            currentImageIndex++;

            if (currentImageIndex < preloadedBlobs.length) {
                // More images pending
                btn.style.backgroundColor = "#f59e0b"; // Orange
                btn.querySelector('span').textContent = "➡️ Next Image (" + (currentImageIndex + 1) + "/" + preloadedBlobs.length + ")";
                statusFn("👉 Paste, then come back & click Next");
            } else {
                // All done
                btn.style.backgroundColor = "#10b981"; // Green
                btn.querySelector('span').textContent = "✅ All Sent (Reset)";
                statusFn("🎉 All images sent!");

                // Reset after delay or next click
                btn.onclick = resetFlow;
            }
        }

        function resetFlow() {
            currentImageIndex = 0;
            const btn = document.getElementById('goBtn');
            btn.style.backgroundColor = "#6366f1"; // Indigo
            btn.querySelector('span').textContent = "🚀 Copy & Go";
            document.getElementById('img-badge').textContent = currentImages.length + " IMG";
            document.getElementById('action-status').textContent = "Ready to start again";
            btn.onclick = runMasterFlow;
        }

        // Utility: Create Vertical Collage from Image Elements
        function createCollageBlob(imgElements) {
            return new Promise((resolve, reject) => {
                if (!imgElements || imgElements.length === 0) return reject(new Error("No images"));

                // Calculate total dimensions
                let maxWidth = 0;
                let totalHeight = 0;
                imgElements.forEach(img => {
                    maxWidth = Math.max(maxWidth, img.naturalWidth);
                    totalHeight += img.naturalHeight;
                });

                // Add some padding/spacing
                const spacing = 20;
                totalHeight += (imgElements.length - 1) * spacing;

                const canvas = document.createElement('canvas');
                canvas.width = maxWidth;
                canvas.height = totalHeight;
                const ctx = canvas.getContext('2d');

                // Fill white background (optional, but safer for transparency)
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let currentY = 0;
                imgElements.forEach(img => {
                    // Center image horizontally
                    const x = (maxWidth - img.naturalWidth) / 2;
                    ctx.drawImage(img, x, currentY);
                    currentY += img.naturalHeight + spacing;
                });

                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error("Collage toBlob failed"));
                }, 'image/png');
            });
        }

        // Utility: Convert Image Element to PNG Blob (Individual)
        function convertToPngBlob(imgElement) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                canvas.width = imgElement.naturalWidth;
                canvas.height = imgElement.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgElement, 0, 0);
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error("Canvas toBlob failed"));
                }, 'image/png');
            });
        }

        // --- Editor Helpers ---
        document.getElementById('editor').addEventListener('input', function () {
            updateStatus("Editing...", "none");
        });

        function saveContent() {
            const val = document.getElementById('editor').value;
            updateStatus("Saving...", "saving");
            google.script.run.withSuccessHandler(() => {
                currentText = val;
                updateStatus("Saved", "active");
            }).withFailureHandler((e) => {
                alert(e.message);
                updateStatus("Error", "error");
            }).updateSidebarContent(val);
        }

        function updateStatus(text, dotClass) {
            document.getElementById('status-text').textContent = text;
            const dot = document.getElementById('dot');
            dot.className = "status-dot " + dotClass;
        }
        async function copyPromptText() {
            if (!currentPromptText) return;
            try {
                await navigator.clipboard.writeText(currentPromptText);
                document.getElementById('action-status').textContent = "✅ Prompt Copied! Paste it.";
            } catch (e) {
                document.getElementById('action-status').textContent = "⚠️ Copy Failed: " + e.message;
            }
        }

        async function copyPromptText() {
            if (!currentPromptText) return;
            try {
                await navigator.clipboard.writeText(currentPromptText);
                document.getElementById('action-status').textContent = "✅ Prompt Copied! Paste it.";
            } catch (e) {
                document.getElementById('action-status').textContent = "⚠️ Copy Failed: " + e.message;
            }
        }

        function updateUrlStatus() {
            const isChecked = document.getElementById('openUrlCheck').checked;
            updateDebug("URL Mode: " + (isChecked ? "ON (Open Tab)" : "OFF (Copy Only)"));
        }

        // Event listener for the checkbox
        document.getElementById('openUrlCheck').addEventListener('change', updateUrlStatus);
    </script>
</body>

</html>
